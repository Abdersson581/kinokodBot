<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Киноафиша | Капитан Кино</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=11" />
</head>
<body>
  <div id="gate" class="hidden">
    <div class="gate">
      <div class="gate-icon">🔒</div>
      <h2>Киноафиша — для подписчиков</h2>
      <p class="gate-text">Афиша, тренажёр и открытие фильмов —<br/>для подписчиков канала «Капитан Кино»</p>
      <button class="btn-primary" id="btn-gate-channel">📢 Подписаться на канал</button>
      <button class="btn-secondary" id="btn-gate-check">✅ Я подписался — проверить</button>
      <button class="btn-back" id="btn-gate-skip">Я уже проверил — открыть афишу</button>
    </div>
  </div>
  <div id="app" class="hidden">
    <header class="header">
      <div class="brand">
        <span class="brand-mark">🎬</span>
        <div class="brand-text">
          <h1>Кино<span class="brand-gold">афиша</span></h1>
          <p class="subtitle">Капитан Кино · 68 фильмов</p>
        </div>
        <button class="btn-lucky" id="btn-lucky" title="Мне повезёт">🎲</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-view="grid">🎬 Афиша</button>
      <button class="tab" data-view="cols">📚 Подборки</button>
      <button class="tab" data-view="fav">❤️ Моё</button>
      <button class="tab" data-view="game">🏋 Тренажёр</button>
    </nav>

    <!-- Афиша + Моё -->
    <div id="view-catalog">
      <div class="toolbar glass" id="toolbar">
        <input type="text" id="search" placeholder="🔍 Поиск или код…" />
        <select id="sort">
          <option value="title">По названию</option>
          <option value="rating">По рейтингу</option>
          <option value="code">По коду</option>
          <option value="new">🔥 По новизне</option>
        </select>
      </div>
      <div id="code-day-banner" class="code-day hidden"></div>
      <div id="hero-shelf" class="hero-shelf hidden">
        <h2 class="shelf-title">🔥 Сейчас в тренде</h2>
        <div class="hero-row" id="hero-row"></div>
      </div>
      <main id="movies-container" class="movies-grid"></main>
    </div>

    <!-- Подборки -->
    <div id="view-cols" class="hidden">
      <main id="cols-container" class="cols-list"></main>
    </div>

    <!-- Карточка фильма -->
    <div id="view-detail" class="hidden"></div>

    <!-- Тренажёр -->
    <div id="view-game" class="hidden"></div>

    <footer class="footer">
      <button class="kinogod-tile" id="btn-kinogod">
        <span class="kt-emoji">🎬</span>
        <span class="kt-body">
          <b>Мой Киногод</b>
          <em>Твой год в кино — карточка-итог</em>
        </span>
        <span class="kt-arrow">→</span>
      </button>
      <p>Разгадай код — открой фильм 🎁</p>
    </footer>
  </div>
  <script src="script.js?v=11"></script>
</body>
</html>
